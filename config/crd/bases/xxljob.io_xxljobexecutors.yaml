apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: xxljobexecutors.xxljob.io
  labels:
    app.kubernetes.io/name: xxl-job-operator
spec:
  group: xxljob.io
  names:
    kind: XxlJobExecutor
    listKind: XxlJobExecutorList
    plural: xxljobexecutors
    singular: xxljobexecutor
    shortNames:
      - xje
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: AppName
          type: string
          jsonPath: .spec.appName
        - name: Mode
          type: string
          jsonPath: .spec.mode
        - name: GroupID
          type: integer
          jsonPath: .status.jobGroupId
        - name: ActivePods
          type: integer
          jsonPath: .status.activePods
        - name: Synced
          type: boolean
          jsonPath: .status.synced
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - adminRef
                - appName
                - title
                - mode
              properties:
                adminRef:
                  type: object
                  required:
                    - name
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                appName:
                  type: string
                  minLength: 4
                  maxLength: 64
                title:
                  type: string
                  minLength: 1
                  # XXL-JOB 2.4.1 DDL: xxl_job_group.title varchar(12)
                  maxLength: 12
                mode:
                  type: string
                  enum:
                    - Resident
                    - Sidecar
                    - K8sJobProxy
                addressType:
                  type: integer
                  enum:
                    - 0
                    - 1
                podSelector:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                executorPort:
                  type: integer
                  format: int32
                  default: 9999
                useServiceDNS:
                  type: boolean
                  default: false
                serviceName:
                  type: string
                staticAddresses:
                  type: array
                  items:
                    type: string
                proxyServiceAddress:
                  type: string
                gracefulDrainSeconds:
                  type: integer
                  format: int32
                  default: 15
                allowedServiceAccounts:
                  type: array
                  items:
                    type: string
                podSecurityLevel:
                  type: string
                  default: restricted
                  enum:
                    - privileged
                    - baseline
                    - restricted
                sidecarEnableGlue:
                  type: boolean
                  default: false
            status:
              type: object
              properties:
                jobGroupId:
                  type: integer
                adminURL:
                  type: string
                synced:
                  type: boolean
                registeredAddresses:
                  type: array
                  items:
                    type: string
                registryKeepAliveAddresses:
                  type: array
                  items:
                    type: string
                drainedAddresses:
                  type: array
                  items:
                    type: string
                activePods:
                  type: integer
                terminatingPodsDrained:
                  type: integer
                lastSyncTime:
                  type: string
                  format: date-time
                message:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
